<div id="app"><div class="top"><div class="wrap"><h1>MHP Deal Finder</h1><div class="muted" id="gen"></div></div></div><div class="wrap">
<h2>Overview</h2><div class="cards" id="cards"></div>
<h2>Parks by State</h2><div class="scroll" id="tS"></div>
<h2>Parks</h2><div class="pills" id="pills"></div>
<div class="ctl"><input id="q" placeholder="Search park, city, county, address…" size="34"><select id="pmin"><option value="10">10+ pads</option><option value="20">20+ pads</option><option value="30">30+ pads</option><option value="40">40+ pads</option></select><select id="ph"><option value="">Any phone</option><option value="1">Has phone</option></select><button class="pill" onclick="expN()">Export notes (CSV)</button><button class="pill" onclick="document.getElementById('impf').click()">Import notes</button><input type="file" id="impf" accept=".csv,.json" style="display:none" onchange="impN(this.files[0])"><span class="muted" id="cnt" style="align-self:center"></span></div>
<div class="scroll" id="tP"></div><br></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let NT=JSON.parse(localStorage.getItem('mhp_notes')||'{}');const pid=p=>[p[0],p[3],p[4],p[5]].join('|').toLowerCase();
const N=n=>Number(n).toLocaleString();let D,ST='';
function render(d){D=d;document.getElementById('gen').textContent='Off-market mobile home parks, 10–50 pads · '+d.parks.length.toLocaleString()+' parks in '+d.states.length+' states · built '+d.generated;
 const P=d.parks,tp=P.reduce((a,p)=>a+p[7],0),wp=P.filter(p=>p[6]).length;
 const C=[['Parks',N(P.length)],['States',d.states.length],['Total Pads',N(tp)],['Avg Pads / Park',(tp/P.length).toFixed(1)],['With Phone',N(wp)],['30–50 Pads',N(P.filter(p=>p[7]>=30).length)]];
 document.getElementById('cards').innerHTML=C.map(c=>`<div class="card"><div class="l">${c[0]}</div><div class="v">${c[1]}</div></div>`).join('');
 let h='<table><thead><tr><th>State</th><th>Parks</th><th>Total Pads</th><th>Avg Pads</th><th>30–50 Pads</th><th>With Phone</th><th>Pulled</th></tr></thead><tbody>',T=[0,0,0,0];
 for(const s of d.states){const L=P.filter(p=>p[0]===s.ab),pd=L.reduce((a,p)=>a+p[7],0),b=L.filter(p=>p[7]>=30).length,w=L.filter(p=>p[6]).length;T[0]+=L.length;T[1]+=pd;T[2]+=b;T[3]+=w;
  h+=`<tr><td>${esc(s.name)}</td><td data-v="${L.length}">${N(L.length)}</td><td data-v="${pd}">${N(pd)}</td><td data-v="${pd/L.length}">${(pd/L.length).toFixed(1)}</td><td data-v="${b}">${N(b)}</td><td data-v="${w}">${N(w)}</td><td>${esc(s.pulled)}</td></tr>`}
 h+=`<tr class="ft"><td>TOTAL</td><td>${N(T[0])}</td><td>${N(T[1])}</td><td>${(T[1]/T[0]).toFixed(1)}</td><td>${N(T[2])}</td><td>${N(T[3])}</td><td></td></tr></tbody></table>`;document.getElementById('tS').innerHTML=h;
 const pl=[['','All']].concat(d.states.map(s=>[s.ab,s.name]));
 document.getElementById('pills').innerHTML=pl.map(x=>`<button class="pill${x[0]===ST?' on':''}" data-s="${x[0]}">${esc(x[1])}</button>`).join('');
 document.querySelectorAll('#pills .pill').forEach(b=>b.onclick=()=>{ST=b.dataset.s;document.querySelectorAll('#pills .pill').forEach(x=>x.classList.toggle('on',x===b));tbl()});
 ['q','pmin','ph'].forEach(i=>document.getElementById(i).oninput=tbl);tbl()}
function tbl(){const q=document.getElementById('q').value.toLowerCase(),mn=+document.getElementById('pmin').value,ph=document.getElementById('ph').value;
 const L=D.parks.filter(p=>(!ST||p[0]===ST)&&p[7]>=mn&&(!ph||p[6])&&(!q||(p[1]+' '+p[2]+' '+p[3]+' '+p[4]+' '+p[5]).toLowerCase().includes(q)));
 document.getElementById('cnt').textContent=N(L.length)+' parks · '+N(L.reduce((a,p)=>a+p[7],0))+' pads';
 let h='<table><thead><tr><th>Park</th><th>State</th><th>City</th><th>County</th><th>Address</th><th>Zip</th><th>Phone</th><th>Pads</th><th>Owner / LLC</th><th>Owner Email</th><th>Debt Expiration</th><th>3-mi Pop</th><th>Notes</th><th>Listing</th><th>Map</th></tr></thead><tbody>';
 for(const p of L){const m=p[8]!=null?`https://www.google.com/maps?q=${p[8]},${p[9]}`:`https://www.google.com/maps/search/${encodeURIComponent(p[3]+' '+p[4]+' '+p[1]+' '+p[0])}`;
  h+=`<tr><td style="text-align:left">${esc(p[3])}</td><td>${p[0]}</td><td style="text-align:left">${esc(p[1])}</td><td style="text-align:left">${esc(p[2])}</td><td style="text-align:left">${esc(p[4])}</td><td>${esc(p[5])}</td><td>${p[6]?`<a href="tel:${esc(p[6])}">${esc(p[6])}</a>`:''}</td><td data-v="${p[7]}">${p[7]}</td><td style="text-align:left">${esc(p[12]||'')}</td><td style="text-align:left">${p[13]?`<a href="mailto:${esc(p[13])}">${esc(p[13])}</a>`:''}</td><td data-v="${esc(p[14]||'')}">${esc(p[14]||'')}</td><td data-v="${p[15]??''}">${p[15]!=null?N(p[15]):''}</td><td data-v="${esc(NT[pid(p)]||'')}" style="text-align:left"><input class="nt" data-id="${esc(pid(p))}" value="${esc(NT[pid(p)]||'')}" placeholder="Add note…"></td><td>${p[11]?`<a href="${esc(p[11])}" target="_blank" rel="noopener">Open</a>`:''}</td><td><a href="${m}" target="_blank" rel="noopener">Map</a></td></tr>`}
 document.getElementById('tP').innerHTML=h+'</tbody></table>'}
document.addEventListener('input',e=>{const t=e.target;if(!t.classList.contains('nt'))return;const v=t.value.trim();if(v)NT[t.dataset.id]=v;else delete NT[t.dataset.id];t.parentNode.dataset.v=v;saveN()});
function saveN(){localStorage.setItem('mhp_notes',JSON.stringify(NT))}
const cq=s=>'"'+String(s).replace(/"/g,'""')+'"';
function expN(){const P=Object.fromEntries(D.parks.map(p=>[pid(p),p]));let c='id,state,park,city,address,note\n';for(const[k,v]of Object.entries(NT)){const p=P[k]||[];c+=[k,p[0]||'',p[3]||'',p[1]||'',p[4]||'',v].map(cq).join(',')+'\n'}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='mhp_notes_'+new Date().toISOString().slice(0,10)+'.csv';a.click()}
function pcsv(t){const R=[];let r=[],f='',q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=c}else if(c=='"')q=1;else if(c==','){r.push(f);f=''}else if(c=='\n'){r.push(f);R.push(r);r=[];f=''}else if(c!='\r')f+=c}if(f||r.length){r.push(f);R.push(r)}return R}
async function impN(f){if(!f)return;const t=await f.text();let n=0;try{if(f.name.endsWith('.json')){for(const[k,v]of Object.entries(JSON.parse(t)))if(v){NT[k]=v;n++}}else{const R=pcsv(t);const i=R[0].indexOf('id'),j=R[0].indexOf('note');for(const r of R.slice(1))if(r[i]&&r[j]){NT[r[i]]=r[j];n++}}saveN();tbl();alert('Imported '+n+' notes')}catch(x){alert('Could not read that file')}document.getElementById('impf').value=''}
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(render);

<script>(function(){const K='mhp_colw';let W=JSON.parse(localStorage.getItem(K)||'{}'),busy=0;
function tid(t){return t.closest('[id]')?.id||'t'}
function apply(){if(busy)return;busy=1;document.querySelectorAll('table').forEach(t=>{const id=tid(t);t.querySelectorAll('thead th').forEach((th,i)=>{const w=W[id+':'+i];if(w){th.style.width=th.style.minWidth=th.style.maxWidth=w+'px';th.style.overflow='hidden';t.style.tableLayout='auto'}else{th.style.width=th.style.minWidth=th.style.maxWidth=''}
 if(!th.querySelector('.rz')){const h=document.createElement('span');h.className='rz';h.title='Drag to resize';th.appendChild(h);
 h.addEventListener('click',e=>{e.stopPropagation();e.preventDefault()},true);
 h.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();const x0=e.clientX,w0=th.offsetWidth;
  const mv=ev=>{const w=Math.max(40,w0+ev.clientX-x0);W[id+':'+i]=w;th.style.width=th.style.minWidth=th.style.maxWidth=w+'px';th.style.overflow='hidden'};
  const up=ev=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);localStorage.setItem(K,JSON.stringify(W));const blk=c=>{c.stopPropagation();c.preventDefault()};window.addEventListener('click',blk,{capture:true,once:true});setTimeout(()=>window.removeEventListener('click',blk,true),50)};
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)})}})});busy=0}
new MutationObserver(apply).observe(document.body,{childList:true,subtree:true});
window.addEventListener('DOMContentLoaded',()=>{const c=document.getElementById('cnt');if(c){const a=document.createElement('span');a.id='rzr';a.textContent='Reset column widths';a.onclick=()=>{W={};localStorage.removeItem(K);apply()};c.after(a)}apply()})})()</script><!--SORTABLE-START--><script>
/* Shared sortable tables (Grok Bot trackers). Click any header: asc/desc toggle with ▲/▼.
   Works on dynamically rendered tables via event delegation. Totals (tfoot, .total/.ft/.tot rows,
   or first cell TOTAL/ALL-TIME/GRAND) stay pinned at bottom. Group-label rows (fewer cells / colspan)
   keep their members: sorting happens within each group. Uses td[data-v] when present.
   Skip: th with own onclick, th.nosort, or table[data-nosort]. */
(function(){
  if(window.__sortableShared)return;window.__sortableShared=1;
  var st=document.createElement('style');
  st.textContent='table:not([data-nosort]) th:not(.nosort){cursor:pointer;user-select:none}th .srt-ar{font-size:.8em;opacity:.85;margin-left:3px}';
  (document.head||document.documentElement).appendChild(st);
  var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  function key(cell){
    if(!cell)return null;
    var raw=cell.dataset&&cell.dataset.v!=null?cell.dataset.v:cell.textContent;
    var s=String(raw).replace(/[▲▼]/g,'').trim();
    if(!s||s==='—'||s==='-'||s==='–'||/^n\/?a$/i.test(s))return null;
    var m;
    if((m=s.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/)))return {n:Date.UTC(+m[1],+m[2]-1,+(m[3]||1))};
    if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){var y=+m[3];if(y<100)y+=2000;return {n:Date.UTC(y,+m[1]-1,+m[2])};}
    if((m=s.match(/^([A-Za-z]{3})[a-z]*\.? (\d{1,2}),? (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[3],MON[m[1].toLowerCase()]-1,+m[2])};
    if((m=s.match(/^([A-Za-z]{3})[a-z]* (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[2],MON[m[1].toLowerCase()]-1,1)};
    if((m=s.match(/^Q([1-4]) (\d{4})$/i)))return {n:Date.UTC(+m[2],(+m[1]-1)*3,1)};

    return {s:s.toLowerCase()};
  }
  function pinned(r){
    if(r.parentElement&&r.parentElement.tagName==='TFOOT')return true;
    if(/(^|\s)(total|totals|ft|tot|sum|grand|pinned)(\s|$)/i.test(r.className))return true;
    var c=r.cells[0];return !!c&&/^\s*(TOTAL|TOTALS|ALL-TIME|GRAND TOTAL)\b/i.test(c.textContent);
  }
  document.addEventListener('click',function(e){
    var th=e.target.closest&&e.target.closest('th');if(!th||th.onclick||th.classList.contains('nosort'))return;
    var tb=th.closest('table');if(!tb||tb.hasAttribute('data-nosort'))return;
    var hr=th.parentElement;if(hr.parentElement.tagName==='TFOOT')return;
    var ci=0;for(var k=0;k<hr.cells.length&&hr.cells[k]!==th;k++)ci+=hr.cells[k].colSpan||1;
    var ncol=0;for(k=0;k<hr.cells.length;k++)ncol+=hr.cells[k].colSpan||1;
    var dir=th.dataset.sdir==='asc'?'desc':'asc',m=dir==='asc'?1:-1;
    tb.querySelectorAll('th').forEach(function(x){delete x.dataset.sdir;var a=x.querySelector('.srt-ar');if(a)a.remove();});
    th.dataset.sdir=dir;var ar=document.createElement('span');ar.className='srt-ar';ar.textContent=dir==='asc'?'▲':'▼';th.appendChild(ar);
    var bodies=tb.tBodies.length?[].slice.call(tb.tBodies):[tb];
    bodies.forEach(function(body){
      var all=[].slice.call(body.rows).filter(function(r){return r!==hr&&!(r.cells.length&&r.cells[0].tagName==='TH'&&!r.querySelector('td'));});
      var pins=[],groups=[{head:null,rows:[]}];
      all.forEach(function(r){
        if(pinned(r)){pins.push(r);return;}
        var w=0;for(var j=0;j<r.cells.length;j++)w+=r.cells[j].colSpan||1;
        if(r.cells.length===1&&ncol>1)groups.push({head:r,rows:[]});else groups[groups.length-1].rows.push(r);
      });
      function cellAt(r){var x=0;for(var j=0;j<r.cells.length;j++){if(x===ci)return r.cells[j];x+=r.cells[j].colSpan||1;}return null;}
      groups.forEach(function(g){
        g.rows.sort(function(a,b){var A=key(cellAt(a)),B=key(cellAt(b));
          if(!A&&!B)return 0;if(!A)return 1;if(!B)return -1;
          if(A.n!=null&&B.n!=null)return (A.n-B.n)*m;
          return String(A.s!=null?A.s:A.n).localeCompare(String(B.s!=null?B.s:B.n),undefined,{numeric:true})*m;});
        if(g.head)body.appendChild(g.head);g.rows.forEach(function(r){body.appendChild(r);});
      });
      pins.forEach(function(r){body.appendChild(r);});
    });
  },false);
})();

</script><!--SORTABLE-END-->
</body></html>
